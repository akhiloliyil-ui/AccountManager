<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <title>Offline · GPA</title>
    <style>
      :root { --bg: #f6f6f3; --surface: #fff; --border: #e6e5df; --text: #17191c; --muted: #6b6f76; --primary: #12a150; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1112; --surface: #17191b; --border: #2a2d30; --text: #eceeef; --muted: #9aa0a6; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 360px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 20px; margin: 16px 0 4px; }
      p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 20px; background: var(--primary); color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>GPA keeps your money data on its server and never shows stale balances. Reconnect to the network your GPA server is on, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>addEventListener("online", () => location.reload());</script>
  </body>
</html>
